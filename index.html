<!doctype html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d8d2ba">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Хронологія">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Хронологія подій</title>
<style>
:root{--bg:#d8d2ba;--panel:#ebe6d0;--ink:#1d2618;--mut:#5b6347;--acc:#4a5d23;--accInk:#f1efd9;--line:#8c8a62;--paper:#f6f3e4}
:root[data-theme=night]{--bg:#0b100c;--panel:#131a14;--ink:#c5d3b2;--mut:#7f9170;--acc:#c9a227;--accInk:#0b100c;--line:#2b3a2d;--paper:#0f150f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
main{max-width:920px;margin:0 auto;padding:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;border-left:6px solid var(--acc);padding-left:10px;border-bottom:3px double var(--line);padding-bottom:6px}
h1{margin:0;font-size:clamp(1rem,4.5vw,1.5rem);text-transform:uppercase;letter-spacing:.08em}
h2{margin:0 0 8px;font-size:.85rem;text-transform:uppercase;letter-spacing:.14em;color:var(--acc)}
section{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--acc);border-radius:4px;padding:10px;margin:10px 0}
textarea,input[type=text],input[type=date],input[type=time],input[type=file]{width:100%;min-height:44px;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:8px}
textarea{min-height:110px}
label{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.wide{grid-column:1/-1}
button{min-height:44px;padding:8px 14px;font:inherit;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accInk);background:var(--acc);border:0;border-radius:4px;cursor:pointer}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.chk{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.95rem;text-transform:none;letter-spacing:0;color:var(--ink)}
.chk input{width:22px;height:22px}
#status{min-height:1.4em;color:var(--mut)}
#out{background:var(--paper);border:1px solid var(--line);padding:10px;overflow-x:auto}
#out p{margin:0;min-height:1em;font:15px/1.35 "Times New Roman",serif;white-space:pre-wrap}
#out p.b{font-weight:700}
.bar{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;padding:8px;background:var(--panel);border-top:2px solid var(--acc)}
.bar button{flex:1 1 130px}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs .tab{flex:1 1 0;width:auto;background:transparent;color:var(--ink);border:1px solid var(--line)}
.tabs .tab.on{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.bad-item{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--acc);padding:8px 10px;margin:0 0 8px}
.bad-item p{margin:0;font:15px/1.35 "Times New Roman",serif;white-space:pre-wrap}
.bad-item .b{font-weight:700}
.bad-item textarea{margin:0}
.bad-item .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.bad-item .row button{flex:1 1 130px}
.bad-item .why{font-weight:700;color:var(--acc);margin:2px 0 6px}
@media(max-width:480px){button{width:100%}}
</style></head><body><main>
<div class="top"><h1>Хронологія подій</h1><button id="theme" class="sec" type="button"></button></div>

<section><h2>Ввід: вставити СМС</h2>
<textarea id="paste" placeholder="Формат «Дата:/Час:/…» або «Ціль N»"></textarea>
<button id="add" type="button">Додати</button></section>

<section><h2>Ввід: чат WhatsApp</h2>
<input type="file" id="file" accept=".txt">
<button id="pick" type="button" style="margin-top:8px">Завантажити з чату</button></section>

<section><h2>Фільтр</h2>
<div class="grid">
<div><label for="day">Дата</label><input type="date" id="day"></div>
<div><label for="from">Час від</label><input type="time" id="from"></div>
<div><label for="to">Час до</label><input type="time" id="to"></div>
<div class="wide"><label for="targets">Цілі (через кому, «б/н» — без номера)</label><input type="text" id="targets" inputmode="text" placeholder="8106, 9841, б/н"></div>
</div>
<label class="chk" style="margin-top:4px;color:var(--mut)">«Від» більше за «до» (22:00–02:00) — доба переходить через північ.</label>
<button id="reset" class="sec" type="button" style="margin-top:8px">Скинути фільтр</button></section>

<section><h2>Фільтр: ключові слова</h2>
<div class="grid">
<div><label for="kd">Дата</label><input type="date" id="kd"></div>
<div><label for="kf">Час від</label><input type="time" id="kf"></div>
<div><label for="kt">Час до</label><input type="time" id="kt"></div>
<div class="wide"><label for="kw">Слова (через кому)</label><input type="text" id="kw" inputmode="text" autocomplete="off"></div>
</div>
<p id="kwHint" style="margin:8px 0 0;color:var(--mut);font-size:.9rem"></p>
<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">
<button id="kwDef" class="sec" type="button">Слова за замовчуванням</button>
<button id="kwReset" class="sec" type="button">Скинути дату й час</button></div></section>

<p id="status" role="status"></p>
<section><div class="tabs" role="tablist">
<button id="tabRep" class="tab on" type="button" role="tab" aria-selected="true">Звіт <span id="count"></span></button>
<button id="tabBad" class="tab" type="button" role="tab" aria-selected="false">Нерозпізнані <span id="badCount"></span></button></div>
<div id="out"></div><div id="bad" hidden></div>
<div class="bar"><button id="docx" type="button">Завантажити .docx</button>
<button id="clear" class="sec" type="button">Очистити</button>
<button id="test" class="sec" type="button">Самотест</button></div></section>
</main>
<script>
'use strict';
// ===================== core: parsing and chronology =====================
const T1 = 'Розрахунки через позиції яких відповідно до засобів відображення пролітала ціль та причини не застосування:';
const T2 = 'Розрахунки, що вели вогонь на ураження цілей (застосування без знищення):';
const MSG_START = /^(\d{2}\.\d{2}\.\d{2}),?\s+(\d{1,2}:\d{2})(?::\d{2})?\s+-\s+/;

const clean = s => s.replace(/<Це повідомлення було відредаговано>/g, '').replace(/[\u200e\u200f]/g, '');
const pad = n => String(n).padStart(2, '0');
const normTime = s => { const m = /(\d{1,2})[:.](\d{2})/.exec(s || ''); return m ? `${pad(m[1])}.${m[2]}` : ''; };
const normDate = s => {
  const m = /(\d{2})\.(\d{2})\.(\d{2,4})/.exec(s || '');
  return m ? `${m[1]}.${m[2]}.${m[3].length === 2 ? '20' + m[3] : m[3]}` : '';
};
// Date first, so 00:10 on the next day sorts after 23:50 (the macro compares time only).
const sortKey = r => { const [d, m, y] = r.date.split('.'); return `${y}${m}${d}${r.time}`; };
const properCase = s => (s ? s[0].toUpperCase() + s.slice(1).toLowerCase() : s);
const lineValue = (lines, label) => {
  const l = lines.find(x => x.trimStart().startsWith(label));
  return l ? l.trimStart().slice(label.length).trim() : '';
};

/** Sums ammo per caliber from "Набій/Снаряд ... - N" and "Розхід X - N" lines. */
function summarizeAmmo(lines) {
  const sums = new Map();
  for (const raw of lines) {
    const l = raw.trim();
    let cal, qty;
    const am = /^(?:Набій|Снаряд)\s/i.test(l) && /-\s*(\d+)\s*$/.exec(l);
    const rz = /^Розхід\s+(\S+)\s*-\s*(\d+)\s*$/i.exec(l);
    if (am) {
      qty = Number(am[1]);
      // Explicit caliber pattern: the macro's lazy regex breaks on "(Canik, Browning) - 100".
      const c = /(\d[\d.,]*\s*[хx×]\s*\d+(?:\s*мм)?)/i.exec(l);
      cal = c ? c[1].trim() : l.replace(/^\S+\s+/, '').replace(/\([^)]*\)/g, '').replace(/-\s*\d+\s*$/, '').trim();
    } else if (rz) { cal = `Розхід ${rz[1]}`; qty = Number(rz[2]); } else continue;
    sums.set(cal, (sums.get(cal) || 0) + qty);
  }
  return [...sums].map(([c, q]) => `${c} – ${q} шт.`).join(', ');
}

/** Labeled format ("Час:/Опис:/…") -> grouped record (section 2). Null if time or description is missing. */
function parseLabeled(lines, msg) {
  const v = l => lineValue(lines, l);
  const time = normTime(v('Час:')), opis = v('Опис:');
  if (!time || !opis) return null;
  const tk = v('Позивний:').split(/\s+/).filter(Boolean);
  const prefix = tk[0] || '';
  let call = prefix;
  if (tk.length > 1) {
    const num = /^\d+$/.test(tk[tk.length - 1]) ? tk.pop() : '';
    const name = [...tk.slice(1).map(properCase), num].filter(Boolean).join(' ');
    if (name) call = `${prefix} "${name}"`;
  }
  const g = re => (re.exec(opis) || [])[1] || '';
  const weapon = v('Зброя:').replace(/^(?:із|з)\s+/i, '').trim();
  const main = `${time} ${call}, ${v('Підрозділ:')}, ${weapon}, ${v('Н.П.:')} ` +
    `(А-${g(/А-(\d+)/i)}, Д-${g(/Д-(\d+)/i)}, К-${g(/К-(\d+)/i)}, Н-${v('Висота:')}). ` +
    `Результат: ${g(/К-\d+,\s*(\S+)/i) || '-'}. Витрати БК: ${summarizeAmmo(lines)};`;
  return {
    kind: 'grouped', target: parseInt(v('№ цілі:'), 10) || 0, isMVG: prefix.toUpperCase() === 'МВГ',
    date: normDate(v('Дата:')) || msg.date, time, main, reason: v('Причина незнищення:'),
  };
}

/** Legacy format -> record grouped by target in section 1. Strict mode (chat) rejects ordinary messages. */
function parseLegacy(lines, msg, strict) {
  let i = lines.findIndex(l => /^Ціль\s/i.test(l.trim()));
  if (i < 0) { if (strict) return null; i = 1; }
  const head = lines.slice(0, i).join(' ');
  if (strict && !normDate(head)) return null;
  if (lines.length < i + 2 || !lines[i + 1].trim()) return null;
  const found = normTime((/\d{1,2}:\d{2}/.exec(head) || [])[0]);
  const L = 'Причина незастосування:', rl = (lines[i + 2] || '').trim();
  const body = rl.startsWith(L) ? rl.slice(L.length).trim() : rl;
  const raw = lines[i + 1].trim();
  return {
    kind: 'legacy', target: parseInt((/(\d+)/.exec(lines[i]) || [])[1], 10) || 0,
    date: normDate(head) || msg.date, time: found || msg.time || '99.99',
    main: found ? `${found} ${raw}` : raw, reason: body && `${L} ${body}`,
  };
}

/** "Результат: не застосовувалась" -> section 1, the whole SMS text kept as-is, grouped by target. */
function parseFull(lines, msg) {
  const body = lines.map(l => l.trim()).filter(Boolean);
  if (!body.length) return null;
  return {
    kind: 'full', target: parseInt(lineValue(lines, '№ цілі:'), 10) || 0, body,
    date: normDate(lineValue(lines, 'Дата:')) || msg.date,
    time: normTime(lineValue(lines, 'Час:')) || msg.time || '99.99',
  };
}

// Reports with "Результат: вибух" are deliberately left out of the report.
const isExplosion = lines => /^вибух/i.test(lineValue(lines, 'Результат:'));

function parseMessage(msg, strict) {
  const lines = msg.lines.map(l => l.replace(/\s+$/, ''));
  if (isExplosion(lines)) return null;
  const text = lines.join('\n');
  const r = /^не\s*застосов/i.test(lineValue(lines, 'Результат:')) ? parseFull(lines, msg)
    : text.includes('Результат:') ? parseLabeled(lines, msg) : parseLegacy(lines, msg, strict);
  if (r) r.key = text.trim();
  return r;
}

const REPORT_LABEL = /^(?:№ цілі|Результат|Позивний|Підрозділ|Зброя|Н\.П\.|Опис|Причина незнищення):/;
const ONE_LINE_REPORT = /№\s*цілі\s*:?\s*\d|^\d{1,2}\.\d{2}\.\d{2,4}\s+час\s+\d{1,2}:\d{2}/i;

/** True if a message looks like an attempt to send a report (known labels or a "Ціль N" line), not ordinary chat. */
const looksLikeReport = lines => lines.some(l => REPORT_LABEL.test(l.trim()) || /^Ціль\s*:?\s*\d/i.test(l.trim()))
  || ONE_LINE_REPORT.test(lines.join('\n').trim());

/** Labeled format: lists every missing required field, not just the first one. */
function explainLabeled(lines) {
  const v = l => lineValue(lines, l), why = [];
  if (!normTime(v('Час:'))) why.push('немає часу («Час:»)');
  if (!v('Опис:')) why.push('немає опису («Опис:»)');
  if (!parseInt(v('№ цілі:'), 10)) why.push('немає номера цілі («№ цілі:»)');
  return why;
}

/** Names the typical way the target number is written wrongly, instead of a bare "missing". */
function missingTarget(lines, text) {
  if (lines.some(l => /^Ціль\s*:\s*\d/i.test(l.trim()))) return 'написано «Ціль: N», потрібно «Ціль N» (без двокрапки)';
  if (/№\s*цілі\s*:?\s*\d/i.test(text)) return 'усе в одному рядку: потрібен окремий рядок «Ціль N»';
  return 'немає номера цілі (рядок «Ціль N» або «№ цілі:»)';
}

/** Legacy format. In strict (chat) mode a missing "Ціль N" line rejects the message right away. */
function explainLegacy(lines, strict) {
  const i = lines.findIndex(l => /^Ціль\s/i.test(l.trim())), why = [], text = lines.join('\n');
  if (i < 0) why.push(missingTarget(lines, text));
  if (i < 0 && strict) return why;
  const at = i < 0 ? 1 : i, head = lines.slice(0, i).join(' ');
  if (strict && !normDate(head)) why.push(/(?:^|\D)\d\.\d{2}\.\d{2,4}/.test(head)
    ? 'дата без нуля в дні (потрібно ДД.ММ.РРРР)' : 'немає дати (перед рядком «Ціль N»)');
  if (lines.length < at + 2 || !lines[at + 1].trim()) why.push('немає опису (рядок після «Ціль N»)');
  return why;
}

/** Reasons why parseMessage returned null; call it only for rejected, non-explosion messages. */
function explainReject(lines, strict) {
  if (!lines.join('').trim()) return ['порожнє повідомлення'];
  const why = lines.join('\n').includes('Результат:') ? explainLabeled(lines) : explainLegacy(lines, strict);
  return why.length ? why : ['невідомий формат'];
}

/** Fixes the typical typos (a colon after «Ціль», a day without a leading zero) so the message parses normally. */
const repairLines = lines => lines.map(l => l
  .replace(/^(\s*)Ціль\s*:\s*(\d)/i, (_, sp, d) => `${sp}Ціль ${d}`)
  .replace(/^(\s*)(\d)(\.\d{2}\.\d{2,4})/, (_, sp, d, rest) => `${sp}0${d}${rest}`));

/** Best guess of where a message sits in time: date/time written in the text, else the chat timestamp. */
function guessPlace(b, text) {
  const tm = /(\d{1,2}):(\d{2})/.exec(text), dm = /(\d{1,2})\.(\d{2})\.(\d{2,4})/.exec(text);
  return {
    date: dm ? normDate(`${pad(dm[1])}.${dm[2]}.${dm[3]}`) : b.date,
    time: tm ? `${pad(tm[1])}.${tm[2]}` : b.time || '',
  };
}

/** Fallback for a message the parser cannot read: text kept as-is, target/date/time guessed only for placement. */
function manualRecord(b, lines) {
  const text = lines.join('\n').trim(), at = guessPlace(b, text);
  const tg = /(?:^|\n)\s*Ціль\s*:?\s*(\d+)/i.exec(text) || /№\s*цілі\s*:?\s*(\d+)/i.exec(text);
  return {
    kind: 'full', manual: true, key: text, body: lines.map(l => l.trim()).filter(Boolean),
    target: tg ? parseInt(tg[1], 10) : 0, date: at.date, time: at.time || '99.99',
  };
}

/** Rejected (possibly edited) message -> record. mode: parsed | fixed (typos repaired first) | asis (kept as text). */
function toRecord(b, asIs = false) {
  const lines = b.text.split('\n'), fixed = repairLines(lines);
  const r = asIs ? null : parseMessage({ date: b.date, time: b.time, lines: fixed }, b.source === 'чат');
  if (r) return { r, mode: fixed.join('\n') === lines.join('\n') ? 'parsed' : 'fixed' };
  return { r: manualRecord(b, lines), mode: 'asis' };
}

/** Reasons why the current text still cannot be added normally; an empty list means it parses. */
function checkBad(b) {
  const lines = repairLines(b.text.split('\n')), strict = b.source === 'чат';
  if (isExplosion(lines)) return ['результат «вибух»: такі повідомлення у звіт не входять'];
  return parseMessage({ date: b.date, time: b.time, lines }, strict) ? [] : explainReject(lines, strict);
}

/** Groups records by target number; "б/н" (0) always goes last. */
function groups(rs) {
  const by = new Map();
  for (const r of rs) by.set(r.target, [...(by.get(r.target) || []), r]);
  return [...by.keys()].sort((a, b) => (a || Infinity) - (b || Infinity)).map(k => [k, by.get(k)]);
}

/** Report paragraphs: section 2 (with counters), then section 1; records sorted by date+time inside groups. */
function buildReport(records) {
  const sorted = [...records].sort((a, b) => sortKey(a).localeCompare(sortKey(b)));
  const P = [], add = (t, b = false) => P.push({ t, b });
  const section = (title, rs, header) => {
    if (!rs.length) return;
    add(title, true); add('');
    for (const [k, g] of groups(rs)) {
      add(header(k, g), true);
      for (const r of g) {
        if (r.body) r.body.forEach(l => add(l)); else add(r.main);
        if (r.reason) add(r.kind === 'grouped' ? `Причина незнищення: ${r.reason}` : r.reason, true);
        add('');
      }
    }
  };
  section(T2, sorted.filter(r => r.kind === 'grouped'), (k, g) => {
    const n = g.filter(r => r.isMVG).length;
    return `Ціль ${k || 'б/н'} - ${g.length} застосувань (МВГ-${n}, ВГ-${g.length - n}):`;
  });
  section(T1, sorted.filter(r => r.kind !== 'grouped'), k => `Ціль ${k || 'б/н'}:`);
  return P;
}

// ===================== filter: date, time window, several targets =====================
const nextDay = ymd => {
  const d = new Date(Date.UTC(+ymd.slice(0, 4), +ymd.slice(4, 6) - 1, +ymd.slice(6, 8) + 1));
  return `${d.getUTCFullYear()}${pad(d.getUTCMonth() + 1)}${pad(d.getUTCDate())}`;
};

/** Window with from > to (22:00-02:00) is treated as crossing midnight into the next day. */
function matches(r, f) {
  if (f.targets.size && !f.targets.has(r.target)) return false;
  const wraps = f.from && f.to && f.from > f.to;
  if (f.day) {
    const key = sortKey(r), end = wraps ? nextDay(f.day) : f.day;
    return key >= f.day + (f.from || '00.00') && key <= end + (f.to || '23.59');
  }
  if (wraps) return r.time >= f.from || r.time <= f.to;
  return (!f.from || r.time >= f.from) && (!f.to || r.time <= f.to);
}

// ===================== keyword filter: own date + time window, editable words =====================
const DEFAULT_WORDS = 'штиль, заборона вогню, заборона застосування, заборона роботи';
const normText = s => s.toLowerCase().replace(/\s+/g, ' ').trim();
const parseWords = s => [...new Set(s.split(/[,;]+/).map(normText).filter(Boolean))];
/** The filter exists only when date, both ends of the period and at least one word are set. */
const kwActive = f => !!(f.day && f.from && f.to && f.words.length);

/** Chat messages inside the window that contain any word, in chronological order. */
function pickMessages(msgs, f) {
  if (!kwActive(f)) return [];
  const win = { day: f.day, from: f.from, to: f.to, targets: new Set() };
  return msgs
    .filter(m => matches({ date: m.date, time: m.time, target: 0 }, win) && f.words.some(w => normText(m.text).includes(w)))
    .sort((a, b) => sortKey(a).localeCompare(sortKey(b)));
}

/** Paragraphs appended at the very end of the report. */
function keywordParagraphs(list, f) {
  if (!list.length) return [];
  const day = `${f.day.slice(6, 8)}.${f.day.slice(4, 6)}.${f.day.slice(0, 4)}`;
  const P = [{ t: `Повідомлення про заборону вогню та штиль за період ${day}, ${f.from}–${f.to}:`, b: true }, { t: '', b: false }];
  for (const m of list) {
    // Date is shown only when the window crosses midnight and the message belongs to the next day.
    const head = `${m.date === day ? '' : m.date.slice(0, 5) + ' '}${m.time} `;
    m.text.split('\n').forEach((l, i) => P.push({ t: i ? l : head + l, b: false }));
    P.push({ t: '', b: false });
  }
  return P;
}

// ===================== infrastructure: WhatsApp, docx, storage =====================
/** Splits a WhatsApp .txt export into messages; continuation lines join the previous message. */
function readChat(text) {
  const msgs = [];
  for (const raw of clean(text).split(/\r?\n/)) {
    const m = MSG_START.exec(raw);
    if (m) {
      const rest = raw.slice(m[0].length), s = /^[^:]+?:\s?/.exec(rest);
      msgs.push({ date: normDate(m[1]), time: normTime(m[2]), lines: [s ? rest.slice(s[0].length) : ''], system: !s });
    } else if (msgs.length) msgs[msgs.length - 1].lines.push(raw);
  }
  return msgs.filter(x => !x.system);
}

// Minimal "stored" ZIP writer: a real .docx without external libraries, so it works offline.
const DOCX_MIME = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
const CRC = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
const crc32 = b => { let c = 0xFFFFFFFF; for (const x of b) c = CRC[(c ^ x) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
const num = (bytes, v) => { const a = new Uint8Array(bytes); new DataView(a.buffer)[bytes === 2 ? 'setUint16' : 'setUint32'](0, v, true); return a; };

function zip(files) {
  const enc = new TextEncoder(), parts = [], cd = [];
  let off = 0;
  for (const [name, str] of files) {
    const nm = enc.encode(name), d = enc.encode(str);
    const common = [num(2, 20), num(2, 0x0800), num(2, 0), num(2, 0), num(2, 33),
      num(4, crc32(d)), num(4, d.length), num(4, d.length), num(2, nm.length), num(2, 0)];
    parts.push(num(4, 0x04034b50), ...common, nm, d);
    cd.push(num(4, 0x02014b50), num(2, 20), ...common, num(2, 0), num(2, 0), num(2, 0), num(4, 0), num(4, off), nm);
    off += 30 + nm.length + d.length;
  }
  const cdSize = cd.reduce((s, a) => s + a.length, 0);
  return new Blob([...parts, ...cd, num(4, 0x06054b50), num(2, 0), num(2, 0),
    num(2, files.length), num(2, files.length), num(4, cdSize), num(4, off), num(2, 0)], { type: DOCX_MIME });
}

const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const FONT = '<w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/>';

function buildDocx(paras) {
  const body = paras.map(({ t, b }) => {
    const rpr = `<w:rPr>${FONT}${b ? '<w:b/>' : ''}<w:sz w:val="28"/></w:rPr>`;
    const run = t ? `<w:r>${rpr}<w:t xml:space="preserve">${esc(t)}</w:t></w:r>` : '';
    return `<w:p><w:pPr><w:spacing w:after="0"/>${rpr}</w:pPr>${run}</w:p>`;
  }).join('');
  const W = 'http://schemas.openxmlformats.org/';
  return zip([
    ['[Content_Types].xml', `<?xml version="1.0" encoding="UTF-8"?><Types xmlns="${W}package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`],
    ['_rels/.rels', `<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="${W}package/2006/relationships"><Relationship Id="rId1" Type="${W}officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`],
    ['word/document.xml', `<?xml version="1.0" encoding="UTF-8"?><w:document xmlns:w="${W}wordprocessingml/2006/main"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="850" w:bottom="1134" w:left="1701" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>`],
  ]);
}

const STORE = 'chronology.v2', THEME = 'chronology.theme', MSGS = 'chronology.msgs.v1', WORDS = 'chronology.words', BAD = 'chronology.bad.v1', DONE = 'chronology.baddone.v1';
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch { return false; /* storage may be blocked or full */ } };

// ===================== presentation =====================
const $ = id => document.getElementById(id);
const status = t => { $('status').textContent = t; };
const today = () => { const d = new Date(); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`; };
let records = (() => {
  // Stored records are re-parsed from their source text, so rule changes (вибух, не застосовувалась) apply retroactively.
  try {
    return JSON.parse(lsGet(STORE) || '[]').map(r => {
      if (r.manual) return r;
      const lines = (r.key || '').split('\n');
      return parseMessage({ date: r.date, time: r.time, lines }, false) || (isExplosion(lines) ? null : r);
    }).filter(Boolean);
  } catch { return []; }
})();

// Non-report chat messages are kept so the keyword filter can be changed without reloading the chat.
let chatMsgs = (() => { try { return JSON.parse(lsGet(MSGS) || '[]'); } catch { return []; } })();

// Rejected report attempts: kept until cleared, so nothing disappears silently.
let bad = (() => { try { return JSON.parse(lsGet(BAD) || '[]'); } catch { return []; } })();
// Originals already sent to the report: reloading the same chat must not bring them back.
const done = (() => { try { return new Set(JSON.parse(lsGet(DONE) || '[]')); } catch { return new Set(); } })();

function readKw() {
  return { day: $('kd').value.replace(/-/g, ''), from: normTime($('kf').value), to: normTime($('kt').value), words: parseWords($('kw').value) };
}
const fullReport = () => { const kw = readKw(); return [...buildReport(visible()), ...keywordParagraphs(pickMessages(chatMsgs, kw), kw)]; };

function readFilter() {
  const targets = new Set($('targets').value.split(/[,;\s]+/).filter(Boolean)
    .map(t => (/^(?:б\/н|бн|0)$/i.test(t) ? 0 : parseInt(t, 10))).filter(n => !Number.isNaN(n)));
  return { day: $('day').value.replace(/-/g, ''), from: normTime($('from').value), to: normTime($('to').value), targets };
}

// The filter is live: records stay stored, only the report view and .docx are narrowed.
const visible = () => records.filter(r => matches(r, readFilter()));

function render() {
  const vis = visible(), kw = readKw(), picked = pickMessages(chatMsgs, kw);
  $('count').textContent = `(${vis.length} із ${records.length})`;
  $('out').replaceChildren(...[...buildReport(vis), ...keywordParagraphs(picked, kw)].map(({ t, b }) => {
    const p = document.createElement('p'); p.textContent = t; if (b) p.className = 'b'; return p;
  }));
  renderBad();
  $('kwHint').textContent = !kw.words.length ? 'Фільтр не діє: додайте хоча б одне слово.'
    : !kwActive(kw) ? 'Фільтр не діє: вкажіть дату та період «від» і «до».'
    : !chatMsgs.length ? 'Немає збережених повідомлень чату: завантажте чат WhatsApp.'
    : `Знайдено: ${picked.length} (збережено повідомлень чату: ${chatMsgs.length}). Вони додаються в кінець звіту.`;
}

const badKey = b => `${b.date}|${b.time}|${b.orig ?? b.text}`;
const saveBad = () => lsSet(BAD, JSON.stringify(bad));
const placeKey = at => sortKey({ date: at.date, time: at.time || '00.00' });

function addBad(list) {
  const seen = new Set([...bad.map(badKey), ...done]);
  let added = 0;
  for (const b of list) {
    const e = { ...b, orig: b.text };
    if (!seen.has(badKey(e))) { seen.add(badKey(e)); bad.push(e); added++; }
  }
  saveBad(); render();
  return added;
}

/** Same date and time window as the report, in chronological order (the target filter does not apply: the number may be unreadable). */
function visibleBad() {
  const f = readFilter();
  return bad.map(b => ({ b, at: guessPlace(b, b.text) }))
    .filter(({ at }) => matches({ date: at.date, time: at.time || '00.00', target: 0 },
      { ...f, targets: new Set(), from: at.time ? f.from : '', to: at.time ? f.to : '' }))
    .sort((x, y) => placeKey(x.at).localeCompare(placeKey(y.at))).map(x => x.b);
}

function mkBtn(label, cls, onclick) {
  const btn = document.createElement('button');
  btn.type = 'button'; btn.className = cls; btn.textContent = label; btn.onclick = onclick;
  return btn;
}

function badCard(b) {
  const card = document.createElement('div'), head = document.createElement('p'), why = document.createElement('p');
  const ta = document.createElement('textarea'), row = document.createElement('div');
  card.className = 'bad-item'; head.className = 'b'; why.className = 'why'; row.className = 'row';
  head.textContent = [b.date, b.time, b.source].filter(Boolean).join(' · ');
  const showWhy = () => {
    const w = checkBad(b);
    why.textContent = w.length ? `Причина: ${w.join('; ')}` : 'Розпізнається: можна додати в звіт.';
  };
  ta.value = b.text;
  ta.oninput = () => { b.text = ta.value; saveBad(); showWhy(); };
  showWhy();
  row.append(mkBtn('Додати в звіт', '', () => sendToReport(b, false)), mkBtn('Додати як є', 'sec', () => sendToReport(b, true)));
  card.append(head, why, ta, row);
  return card;
}

function renderBad() {
  const vis = visibleBad();
  $('badCount').textContent = `(${vis.length} із ${bad.length})`;
  const msg = text => { const p = document.createElement('p'); p.textContent = text; return p; };
  const clear = mkBtn(`Очистити весь список (${bad.length})`, 'sec', () => {
    if (confirm('Очистити весь список нерозпізнаних?')) { bad = []; saveBad(); render(); }
  });
  $('bad').replaceChildren(...(!bad.length ? [msg('Нерозпізнаних повідомлень немає.')]
    : !vis.length ? [msg(`За датою й часом фільтра нерозпізнаних немає (у списку всього: ${bad.length}).`), clear]
    : [...vis.map(badCard), clear]));
}

function setTab(name) {
  $('out').hidden = name !== 'rep';
  $('bad').hidden = name !== 'bad';
  for (const [id, key] of [['tabRep', 'rep'], ['tabBad', 'bad']]) {
    $(id).classList.toggle('on', key === name);
    $(id).setAttribute('aria-selected', String(key === name));
  }
}
$('tabRep').onclick = () => setTab('rep');
$('tabBad').onclick = () => setTab('bad');

function addRecords(list) {
  let added = 0;
  for (const r of list) if (r && !records.some(x => x.key === r.key)) { records.push(r); added++; }
  lsSet(STORE, JSON.stringify(records)); render();
  return added;
}

/** Sends the (edited) message to the report; the record lands in date+time order inside its target group. */
function sendToReport(b, asIs) {
  if (isExplosion(b.text.split('\n'))) return status('Результат «вибух»: у звіт не входить.');
  const why = checkBad(b);
  if (why.length && !asIs) return status(`Ще не розпізнається: ${why.join('; ')}. Виправте текст або натисніть «Додати як є».`);
  const { r, mode } = toRecord(b, asIs);
  bad = bad.filter(x => x !== b); saveBad();
  done.add(badKey(b)); lsSet(DONE, JSON.stringify([...done]));
  const added = addRecords([r]);
  const how = { parsed: 'запис розібрано', fixed: 'виправлено типову помилку, запис розібрано',
    asis: `текст додано як є: ціль ${r.target || 'б/н'}, ${r.date} ${r.time === '99.99' ? 'час не знайдено, запис унизу групи' : r.time.replace('.', ':')}` }[mode];
  status((added ? `Додано у звіт (${how}).` : 'Такий запис у звіті вже є, зі списку прибрано.')
    + (matches(r, readFilter()) ? '' : ' Він не підпадає під поточний фільтр: натисніть «Скинути фільтр».'));
}

function addMessages(list) {
  const seen = new Set(chatMsgs.map(m => `${m.date}|${m.time}|${m.text}`));
  let added = 0;
  for (const m of list) {
    const k = `${m.date}|${m.time}|${m.text}`;
    if (!seen.has(k)) { seen.add(k); chatMsgs.push(m); added++; }
  }
  if (!lsSet(MSGS, JSON.stringify(chatMsgs))) status('Увага: пам’ять браузера переповнена, повідомлення чату не збережуться після перезавантаження.');
  render();
  return added;
}

function setTheme(t) {
  document.documentElement.dataset.theme = t;
  $('theme').textContent = t === 'night' ? '☀ День' : '☾ Ніч';
  document.querySelector('meta[name=theme-color]').content = t === 'night' ? '#0b100c' : '#d8d2ba';
  lsSet(THEME, t);
}
$('theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'night' ? 'day' : 'night');
setTheme(lsGet(THEME) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day'));

$('add').onclick = () => {
  const lines = clean($('paste').value).split(/\r?\n/);
  while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
  if (isExplosion(lines)) return status('Пропущено: результат «вибух» у звіт не входить.');
  const r = parseMessage({ date: today(), time: '', lines }, false);
  if (!r) {
    const text = lines.join('\n').trim();
    if (!text) return status('Нічого вставити.');
    const reasons = explainReject(lines, false);
    addBad([{ date: today(), time: '', source: 'вставка', text, reasons }]);
    const shown = visibleBad().some(x => x.orig === text);
    return status(`Не розпізнано (додано у вкладку «Нерозпізнані»): ${reasons.join('; ')}.`
      + (shown ? '' : ' У списку його не видно через фільтр дати й часу: натисніть «Скинути фільтр».'));
  }
  const added = addRecords([r]);
  status(!added ? 'Такий запис уже є.' : matches(r, readFilter()) ? 'Запис додано.'
    : 'Запис додано, але він не підпадає під поточний фільтр. Натисніть «Скинути фільтр».');
  $('paste').value = '';
};

$('pick').onclick = async () => {
  const f = $('file').files[0];
  if (!f) return status('Оберіть файл чату.');
  const msgs = readChat(await f.text());
  const found = [], others = [], rejected = [];
  for (const m of msgs) {
    const r = parseMessage(m, true);
    if (r) found.push(r);
    else if (!isExplosion(m.lines)) {
      const lines = m.lines.map(l => l.replace(/\s+$/, ''));
      const text = lines.join('\n').trim();
      if (!text) continue;
      others.push({ date: m.date, time: m.time, text });
      if (looksLikeReport(lines)) rejected.push({ date: m.date, time: m.time, source: 'чат', text, reasons: explainReject(lines, true) });
    }
  }
  const skipped = msgs.filter(m => isExplosion(m.lines)).length;
  // Without a date the whole chat would fill the report, so default to the newest day found.
  if (!$('day').value && found.length) {
    const [d, m, y] = found.reduce((a, r) => (sortKey(r) > sortKey(a) ? r : a)).date.split('.');
    $('day').value = `${y}-${m}-${d}`;
  }
  const addedMsgs = addMessages(others), addedBad = addBad(rejected);
  status(`Повідомлень у чаті: ${msgs.length}. Звітів знайдено: ${found.length}. Нових додано: ${addRecords(found)}. Пропущено «вибух»: ${skipped}. Інших повідомлень збережено: ${addedMsgs}. Нерозпізнаних додано: ${addedBad}.`);
};

for (const id of ['day', 'from', 'to', 'targets']) $(id).addEventListener('input', render);
$('kw').value = lsGet(WORDS) ?? DEFAULT_WORDS;
for (const id of ['kd', 'kf', 'kt', 'kw']) $(id).addEventListener('input', () => { if (id === 'kw') lsSet(WORDS, $('kw').value); render(); });
$('kwDef').onclick = () => { $('kw').value = DEFAULT_WORDS; lsSet(WORDS, DEFAULT_WORDS); render(); };
$('kwReset').onclick = () => { for (const id of ['kd', 'kf', 'kt']) $(id).value = ''; render(); };
$('reset').onclick = () => { for (const id of ['day', 'from', 'to', 'targets']) $(id).value = ''; render(); };

$('docx').onclick = () => {
  const paras = fullReport();
  if (!paras.length) return status('Звіт порожній.');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(buildDocx(paras));
  a.download = `Хронологія_${$('day').value || today()}.docx`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};

$('clear').onclick = () => { if (confirm('Очистити весь звіт?')) { records = []; chatMsgs = []; bad = []; done.clear(); lsSet(STORE, '[]'); lsSet(MSGS, '[]'); lsSet(BAD, '[]'); lsSet(DONE, '[]'); render(); } };

    && explainReject(['5.10.2026 час 21:58', 'Ціль 8069', 'опис'], true)[0].includes('без нуля'));
  ok('unrecognized: corridor notice with «Висота:» is not a report', !looksLikeReport(['Коридор 3', 'Висота: 300', 'з 10:00 до 12:00']));
  const fix = toRecord({ date: '', time: '', source: 'чат', text: '5.10.2026 час 21:58\nЦіль: 8069\nМВГ 29, далеко\nПричина незастосування: Далеко' });
  ok('add to report: typos repaired, parsed normally', fix.mode === 'fixed' && fix.r.target === 8069 && fix.r.date === '05.10.2026' && fix.r.time === '21.58');
  const man = toRecord({ date: '28.06.2026', time: '06.45', source: 'чат', text: '27.06.2026 час 05:04 МВГ П-50 № цілі: 9506 А-280' }).r;
  ok('add to report: unreadable text kept as-is with guessed placement', man.manual && man.target === 9506 && man.date === '27.06.2026' && man.time === '05.04' && man.body.length === 1);
  ok('add to report: sorted by date+time inside the target group', (() => {
    const mk = (d, t) => ({ kind: 'full', target: 5, date: d, time: t, body: [`${d} ${t}`] });
    const P = buildReport([mk('14.05.2026', '00.10'), mk('13.05.2026', '23.50')]).map(x => x.t);
    return P.indexOf('13.05.2026 23.50') < P.indexOf('14.05.2026 00.10');
  })());
  const edited = { date: '', time: '', source: 'чат', text: '05.10.2026 час 21:58\nЦіль 8069\nМВГ 29, далеко\nПричина незастосування: Далеко' };
  ok('edit: corrected text parses, no reasons left', toRecord(edited).mode === 'parsed' && !checkBad(edited).length);
  ok('edit: still broken text keeps reasons', checkBad({ ...edited, text: 'Ціль 8069' }).length > 0);
  const gp = guessPlace({ date: '28.06.2026', time: '06.45' }, '27.06.2026 час 05:04 текст');
  ok('date filter: place taken from the text, else from the chat', gp.date === '27.06.2026' && gp.time === '05.04'
    && guessPlace({ date: '28.06.2026', time: '' }, 'без часу').time === '');
  ok('date filter: same day window as the report', matches({ date: gp.date, time: gp.time, target: 0 }, { day: '20260627', from: '', to: '', targets: new Set() })
    && !matches({ date: '28.06.2026', time: '05.04', target: 0 }, { day: '20260627', from: '', to: '', targets: new Set() }));
  status(res.join('   '));
};

render();

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').catch(() => { /* app still works online */ });
}
