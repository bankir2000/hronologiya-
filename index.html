<!doctype html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d8d2ba">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Хронологія">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Хронологія подій</title>
<style>
:root{--bg:#d8d2ba;--panel:#ebe6d0;--ink:#1d2618;--mut:#5b6347;--acc:#4a5d23;--accInk:#f1efd9;--line:#8c8a62;--paper:#f6f3e4}
:root[data-theme=night]{--bg:#0b100c;--panel:#131a14;--ink:#c5d3b2;--mut:#7f9170;--acc:#c9a227;--accInk:#0b100c;--line:#2b3a2d;--paper:#0f150f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
main{max-width:920px;margin:0 auto;padding:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;border-left:6px solid var(--acc);padding-left:10px;border-bottom:3px double var(--line);padding-bottom:6px}
h1{margin:0;font-size:clamp(1rem,4.5vw,1.5rem);text-transform:uppercase;letter-spacing:.08em}
h2{margin:0 0 8px;font-size:.85rem;text-transform:uppercase;letter-spacing:.14em;color:var(--acc)}
section{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--acc);border-radius:4px;padding:10px;margin:10px 0}
textarea,input[type=text],input[type=date],input[type=time],input[type=file]{width:100%;min-height:44px;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:8px}
textarea{min-height:110px}
label{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.wide{grid-column:1/-1}
button{min-height:44px;padding:8px 14px;font:inherit;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accInk);background:var(--acc);border:0;border-radius:4px;cursor:pointer}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.chk{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.95rem;text-transform:none;letter-spacing:0;color:var(--ink)}
.chk input{width:22px;height:22px}
#status{min-height:1.4em;color:var(--mut)}
#out{background:var(--paper);border:1px solid var(--line);padding:10px;overflow-x:auto}
#out p{margin:0;min-height:1em;font:15px/1.35 "Times New Roman",serif;white-space:pre-wrap}
#out p.b{font-weight:700}
.bar{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;padding:8px;background:var(--panel);border-top:2px solid var(--acc)}
.bar button{flex:1 1 130px}
@media(max-width:480px){button{width:100%}}
</style></head><body><main>
<div class="top"><h1>Хронологія подій</h1><button id="theme" class="sec" type="button"></button></div>

<section><h2>Ввід: вставити СМС</h2>
<textarea id="paste" placeholder="Формат «Дата:/Час:/…» або «Ціль N»"></textarea>
<button id="add" type="button">Додати</button></section>

<section><h2>Ввід: чат WhatsApp</h2>
<input type="file" id="file" accept=".txt">
<button id="pick" type="button" style="margin-top:8px">Відібрати з чату за фільтром</button></section>

<section><h2>Фільтр</h2>
<div class="grid">
<div><label for="day">Дата</label><input type="date" id="day"></div>
<div><label for="from">Час від</label><input type="time" id="from"></div>
<div><label for="to">Час до</label><input type="time" id="to"></div>
<div class="wide"><label for="targets">Цілі (через кому, «б/н» — без номера)</label><input type="text" id="targets" inputmode="text" placeholder="8106, 9841, б/н"></div>
</div>
<label class="chk"><input type="checkbox" id="apply">Застосувати фільтр до звіту та .docx</label>
<label class="chk" style="margin-top:4px;color:var(--mut)">«Від» більше за «до» (22:00–02:00) — доба переходить через північ.</label></section>

<p id="status" role="status"></p>
<section><h2>Звіт</h2><div id="out"></div>
<div class="bar"><button id="docx" type="button">Завантажити .docx</button>
<button id="clear" class="sec" type="button">Очистити</button>
<button id="test" class="sec" type="button">Самотест</button></div></section>
</main>
<script>
'use strict';
// ===================== core: parsing and chronology =====================
const T1 = 'Розрахунки через позиції яких відповідно до засобів відображення пролітала ціль та причини не застосування:';
const T2 = 'Розрахунки, що вели вогонь на ураження цілей (застосування без знищення):';
const MSG_START = /^(\d{2}\.\d{2}\.\d{2}),?\s+(\d{1,2}:\d{2})(?::\d{2})?\s+-\s+/;

const clean = s => s.replace(/<Це повідомлення було відредаговано>/g, '').replace(/[\u200e\u200f]/g, '');
const pad = n => String(n).padStart(2, '0');
const normTime = s => { const m = /(\d{1,2})[:.](\d{2})/.exec(s || ''); return m ? `${pad(m[1])}.${m[2]}` : ''; };
const normDate = s => {
  const m = /(\d{2})\.(\d{2})\.(\d{2,4})/.exec(s || '');
  return m ? `${m[1]}.${m[2]}.${m[3].length === 2 ? '20' + m[3] : m[3]}` : '';
};
// Date first, so 00:10 on the next day sorts after 23:50 (the macro compares time only).
const sortKey = r => { const [d, m, y] = r.date.split('.'); return `${y}${m}${d}${r.time}`; };
const properCase = s => (s ? s[0].toUpperCase() + s.slice(1).toLowerCase() : s);
const lineValue = (lines, label) => {
  const l = lines.find(x => x.trimStart().startsWith(label));
  return l ? l.trimStart().slice(label.length).trim() : '';
};

/** Sums ammo per caliber from "Набій/Снаряд ... - N" and "Розхід X - N" lines. */
function summarizeAmmo(lines) {
  const sums = new Map();
  for (const raw of lines) {
    const l = raw.trim();
    let cal, qty;
    const am = /^(?:Набій|Снаряд)\s/i.test(l) && /-\s*(\d+)\s*$/.exec(l);
    const rz = /^Розхід\s+(\S+)\s*-\s*(\d+)\s*$/i.exec(l);
    if (am) {
      qty = Number(am[1]);
      // Explicit caliber pattern: the macro's lazy regex breaks on "(Canik, Browning) - 100".
      const c = /(\d[\d.,]*\s*[хx×]\s*\d+(?:\s*мм)?)/i.exec(l);
      cal = c ? c[1].trim() : l.replace(/^\S+\s+/, '').replace(/\([^)]*\)/g, '').replace(/-\s*\d+\s*$/, '').trim();
    } else if (rz) { cal = `Розхід ${rz[1]}`; qty = Number(rz[2]); } else continue;
    sums.set(cal, (sums.get(cal) || 0) + qty);
  }
  return [...sums].map(([c, q]) => `${c} – ${q} шт.`).join(', ');
}

/** Labeled format ("Час:/Опис:/…") -> grouped record (section 2). Null if time or description is missing. */
function parseLabeled(lines, msg) {
  const v = l => lineValue(lines, l);
  const time = normTime(v('Час:')), opis = v('Опис:');
  if (!time || !opis) return null;
  const tk = v('Позивний:').split(/\s+/).filter(Boolean);
  const prefix = tk[0] || '';
  let call = prefix;
  if (tk.length > 1) {
    const num = /^\d+$/.test(tk[tk.length - 1]) ? tk.pop() : '';
    const name = [...tk.slice(1).map(properCase), num].filter(Boolean).join(' ');
    if (name) call = `${prefix} "${name}"`;
  }
  const g = re => (re.exec(opis) || [])[1] || '';
  const weapon = v('Зброя:').replace(/^(?:із|з)\s+/i, '').trim();
  const main = `${time} ${call}, ${v('Підрозділ:')}, ${weapon}, ${v('Н.П.:')} ` +
    `(А-${g(/А-(\d+)/i)}, Д-${g(/Д-(\d+)/i)}, К-${g(/К-(\d+)/i)}, Н-${v('Висота:')}). ` +
    `Результат: ${g(/К-\d+,\s*(\S+)/i) || '-'}. Витрати БК: ${summarizeAmmo(lines)};`;
  return {
    kind: 'grouped', target: parseInt(v('№ цілі:'), 10) || 0, isMVG: prefix.toUpperCase() === 'МВГ',
    date: normDate(v('Дата:')) || msg.date, time, main, reason: v('Причина незнищення:'),
  };
}

/** Legacy format -> record grouped by target in section 1. Strict mode (chat) rejects ordinary messages. */
function parseLegacy(lines, msg, strict) {
  let i = lines.findIndex(l => /^Ціль\s/i.test(l.trim()));
  if (i < 0) { if (strict) return null; i = 1; }
  const head = lines.slice(0, i).join(' ');
  if (strict && !normDate(head)) return null;
  if (lines.length < i + 2 || !lines[i + 1].trim()) return null;
  const found = normTime((/\d{1,2}:\d{2}/.exec(head) || [])[0]);
  const L = 'Причина незастосування:', rl = (lines[i + 2] || '').trim();
  const body = rl.startsWith(L) ? rl.slice(L.length).trim() : rl;
  const raw = lines[i + 1].trim();
  return {
    kind: 'legacy', target: parseInt((/(\d+)/.exec(lines[i]) || [])[1], 10) || 0,
    date: normDate(head) || msg.date, time: found || msg.time || '99.99',
    main: found ? `${found} ${raw}` : raw, reason: body && `${L} ${body}`,
  };
}

/** "Результат: не застосовувалась" -> section 1, the whole SMS text kept as-is, grouped by target. */
function parseFull(lines, msg) {
  const body = lines.map(l => l.trim()).filter(Boolean);
  if (!body.length) return null;
  return {
    kind: 'full', target: parseInt(lineValue(lines, '№ цілі:'), 10) || 0, body,
    date: normDate(lineValue(lines, 'Дата:')) || msg.date,
    time: normTime(lineValue(lines, 'Час:')) || msg.time || '99.99',
  };
}

// Reports with "Результат: вибух" are deliberately left out of the report.
const isExplosion = lines => /^вибух/i.test(lineValue(lines, 'Результат:'));

function parseMessage(msg, strict) {
  const lines = msg.lines.map(l => l.replace(/\s+$/, ''));
  if (isExplosion(lines)) return null;
  const text = lines.join('\n');
  const r = /^не\s*застосов/i.test(lineValue(lines, 'Результат:')) ? parseFull(lines, msg)
    : text.includes('Результат:') ? parseLabeled(lines, msg) : parseLegacy(lines, msg, strict);
  if (r) r.key = text.trim();
  return r;
}

/** Groups records by target number; "б/н" (0) always goes last. */
function groups(rs) {
  const by = new Map();
  for (const r of rs) by.set(r.target, [...(by.get(r.target) || []), r]);
  return [...by.keys()].sort((a, b) => (a || Infinity) - (b || Infinity)).map(k => [k, by.get(k)]);
}

/** Report paragraphs: section 2 (with counters), then section 1; records sorted by date+time inside groups. */
function buildReport(records) {
  const sorted = [...records].sort((a, b) => sortKey(a).localeCompare(sortKey(b)));
  const P = [], add = (t, b = false) => P.push({ t, b });
  const section = (title, rs, header) => {
    if (!rs.length) return;
    add(title, true); add('');
    for (const [k, g] of groups(rs)) {
      add(header(k, g), true);
      for (const r of g) {
        if (r.body) r.body.forEach(l => add(l)); else add(r.main);
        if (r.reason) add(r.kind === 'grouped' ? `Причина незнищення: ${r.reason}` : r.reason, true);
        add('');
      }
    }
  };
  section(T2, sorted.filter(r => r.kind === 'grouped'), (k, g) => {
    const n = g.filter(r => r.isMVG).length;
    return `Ціль ${k || 'б/н'} - ${g.length} застосувань (МВГ-${n}, ВГ-${g.length - n}):`;
  });
  section(T1, sorted.filter(r => r.kind !== 'grouped'), k => `Ціль ${k || 'б/н'}:`);
  return P;
}

// ===================== filter: date, time window, several targets =====================
const nextDay = ymd => {
  const d = new Date(Date.UTC(+ymd.slice(0, 4), +ymd.slice(4, 6) - 1, +ymd.slice(6, 8) + 1));
  return `${d.getUTCFullYear()}${pad(d.getUTCMonth() + 1)}${pad(d.getUTCDate())}`;
};

/** Window with from > to (22:00-02:00) is treated as crossing midnight into the next day. */
function matches(r, f) {
  if (f.targets.size && !f.targets.has(r.target)) return false;
  const wraps = f.from && f.to && f.from > f.to;
  if (f.day) {
    const key = sortKey(r), end = wraps ? nextDay(f.day) : f.day;
    return key >= f.day + (f.from || '00.00') && key <= end + (f.to || '23.59');
  }
  if (wraps) return r.time >= f.from || r.time <= f.to;
  return (!f.from || r.time >= f.from) && (!f.to || r.time <= f.to);
}

// ===================== infrastructure: WhatsApp, docx, storage =====================
/** Splits a WhatsApp .txt export into messages; continuation lines join the previous message. */
function readChat(text) {
  const msgs = [];
  for (const raw of clean(text).split(/\r?\n/)) {
    const m = MSG_START.exec(raw);
    if (m) {
      const rest = raw.slice(m[0].length), s = /^[^:]+?:\s?/.exec(rest);
      msgs.push({ date: normDate(m[1]), time: normTime(m[2]), lines: [s ? rest.slice(s[0].length) : ''], system: !s });
    } else if (msgs.length) msgs[msgs.length - 1].lines.push(raw);
  }
  return msgs.filter(x => !x.system);
}

// Minimal "stored" ZIP writer: a real .docx without external libraries, so it works offline.
const DOCX_MIME = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
const CRC = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
const crc32 = b => { let c = 0xFFFFFFFF; for (const x of b) c = CRC[(c ^ x) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
const num = (bytes, v) => { const a = new Uint8Array(bytes); new DataView(a.buffer)[bytes === 2 ? 'setUint16' : 'setUint32'](0, v, true); return a; };

function zip(files) {
  const enc = new TextEncoder(), parts = [], cd = [];
  let off = 0;
  for (const [name, str] of files) {
    const nm = enc.encode(name), d = enc.encode(str);
    const common = [num(2, 20), num(2, 0x0800), num(2, 0), num(2, 0), num(2, 33),
      num(4, crc32(d)), num(4, d.length), num(4, d.length), num(2, nm.length), num(2, 0)];
    parts.push(num(4, 0x04034b50), ...common, nm, d);
    cd.push(num(4, 0x02014b50), num(2, 20), ...common, num(2, 0), num(2, 0), num(2, 0), num(4, 0), num(4, off), nm);
    off += 30 + nm.length + d.length;
  }
  const cdSize = cd.reduce((s, a) => s + a.length, 0);
  return new Blob([...parts, ...cd, num(4, 0x06054b50), num(2, 0), num(2, 0),
    num(2, files.length), num(2, files.length), num(4, cdSize), num(4, off), num(2, 0)], { type: DOCX_MIME });
}

const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const FONT = '<w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/>';

function buildDocx(paras) {
  const body = paras.map(({ t, b }) => {
    const rpr = `<w:rPr>${FONT}${b ? '<w:b/>' : ''}<w:sz w:val="28"/></w:rPr>`;
    const run = t ? `<w:r>${rpr}<w:t xml:space="preserve">${esc(t)}</w:t></w:r>` : '';
    return `<w:p><w:pPr><w:spacing w:after="0"/>${rpr}</w:pPr>${run}</w:p>`;
  }).join('');
  const W = 'http://schemas.openxmlformats.org/';
  return zip([
    ['[Content_Types].xml', `<?xml version="1.0" encoding="UTF-8"?><Types xmlns="${W}package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`],
    ['_rels/.rels', `<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="${W}package/2006/relationships"><Relationship Id="rId1" Type="${W}officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`],
    ['word/document.xml', `<?xml version="1.0" encoding="UTF-8"?><w:document xmlns:w="${W}wordprocessingml/2006/main"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="850" w:bottom="1134" w:left="1701" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>`],
  ]);
}

const STORE = 'chronology.v2', THEME = 'chronology.theme';
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch { /* storage may be blocked */ } };

// ===================== presentation =====================
const $ = id => document.getElementById(id);
const status = t => { $('status').textContent = t; };
const today = () => { const d = new Date(); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`; };
let records = (() => {
  // Stored records are re-parsed from their source text, so rule changes (вибух, не застосовувалась) apply retroactively.
  try {
    return JSON.parse(lsGet(STORE) || '[]').map(r => {
      const lines = (r.key || '').split('\n');
      return parseMessage({ date: r.date, time: r.time, lines }, false) || (isExplosion(lines) ? null : r);
    }).filter(Boolean);
  } catch { return []; }
})();

function readFilter() {
  const targets = new Set($('targets').value.split(/[,;\s]+/).filter(Boolean)
    .map(t => (/^(?:б\/н|бн|0)$/i.test(t) ? 0 : parseInt(t, 10))).filter(n => !Number.isNaN(n)));
  return { day: $('day').value.replace(/-/g, ''), from: normTime($('from').value), to: normTime($('to').value), targets };
}
const visible = () => ($('apply').checked ? records.filter(r => matches(r, readFilter())) : records);

function render() {
  $('out').replaceChildren(...buildReport(visible()).map(({ t, b }) => {
    const p = document.createElement('p'); p.textContent = t; if (b) p.className = 'b'; return p;
  }));
}

function addRecords(list) {
  let added = 0;
  for (const r of list) if (r && !records.some(x => x.key === r.key)) { records.push(r); added++; }
  lsSet(STORE, JSON.stringify(records)); render();
  return added;
}

function setTheme(t) {
  document.documentElement.dataset.theme = t;
  $('theme').textContent = t === 'night' ? '☀ День' : '☾ Ніч';
  document.querySelector('meta[name=theme-color]').content = t === 'night' ? '#0b100c' : '#d8d2ba';
  lsSet(THEME, t);
}
$('theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'night' ? 'day' : 'night');
setTheme(lsGet(THEME) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day'));

$('add').onclick = () => {
  const lines = clean($('paste').value).split(/\r?\n/);
  while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
  if (isExplosion(lines)) return status('Пропущено: результат «вибух» у звіт не входить.');
  const r = parseMessage({ date: today(), time: '', lines }, false);
  if (!r) return status('Не розпізнано: потрібні «Час:» та «Опис:» або рядки «Ціль N» і опис.');
  status(addRecords([r]) ? 'Запис додано.' : 'Такий запис уже є.');
  $('paste').value = '';
};

$('pick').onclick = async () => {
  const f = $('file').files[0];
  if (!f) return status('Оберіть файл чату.');
  const flt = readFilter(), msgs = readChat(await f.text());
  const found = msgs.map(m => parseMessage(m, true)).filter(r => r && matches(r, flt));
  const skipped = msgs.filter(m => isExplosion(m.lines)).length;
  status(`Повідомлень у чаті: ${msgs.length}. Підійшло під фільтр: ${found.length}. Нових додано: ${addRecords(found)}. Пропущено «вибух»: ${skipped}.`);
};

for (const id of ['day', 'from', 'to', 'targets', 'apply']) $(id).addEventListener('input', render);

$('docx').onclick = () => {
  const rs = visible();
  if (!rs.length) return status('Звіт порожній.');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(buildDocx(buildReport(rs)));
  a.download = `Хронологія_${$('day').value || today()}.docx`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};

$('clear').onclick = () => { if (confirm('Очистити весь звіт?')) { records = []; lsSet(STORE, '[]'); render(); } };

$('test').onclick = () => {
  const res = [], ok = (n, c) => res.push(`${c ? '✓' : '✗'} ${n}`), e = { date: '', time: '' };
  const s = ['Дата: 13.05.2026', 'Час: 04:01', '№ цілі: 8106', 'Результат: вибух', 'Н.П.: ВІНТЕНЦІ', 'Підрозділ: 13 озкб',
    'Позивний: МВГ П 27', 'Зброя: із ЗКУ Viktor MR-2 14.5', 'Висота: 1500', 'Опис: А-35, Д-3000, К-220, обстріляно 1 БПЛА',
    'Набій 14,5х114 мм (ЗПУ, КПВТ) БЗТ - 27', 'Набій 14,5х114 мм (ЗПУ, КПВТ) МДЗ - 53'];
  const r = parseLabeled(s, e);
  ok('labeled: callsign + ammo sum', !!r && r.main.startsWith('04.01 МВГ "П 27", 13 озкб') && r.main.includes('14,5х114 мм – 80 шт.'));
  ok('negative: no Опис -> null', parseLabeled(s.filter(l => !l.startsWith('Опис')), e) === null);
  const lg = parseLegacy(['28.09.2026 час 06:22', 'Ціль 9841', 'МВГ 29 (А-114°), далеко', 'Причина незастосування: Далеко'], e, true);
  ok('legacy: time, target, tail kept', !!lg && lg.target === 9841 && lg.main === '06.22 МВГ 29 (А-114°), далеко' && lg.reason.endsWith('Далеко'));
  const f = { day: '20260513', from: '22.00', to: '02.00', targets: new Set() };
  ok('filter: 22:00-02:00 crosses midnight',
    matches({ date: '14.05.2026', time: '01.00', target: 1 }, f) && !matches({ date: '14.05.2026', time: '03.00', target: 1 }, f));
  ok('filter: target list', !matches({ date: '13.05.2026', time: '23.00', target: 2 }, { day: '', from: '', to: '', targets: new Set([1]) }));
  ok('explosion: skipped', parseMessage({ date: '', time: '', lines: s }, true) === null && parseMessage({ date: '', time: '', lines: s.map(l => l.replace('вибух', 'не знищено')) }, true) !== null);
  const ns = parseMessage({ date: '', time: '', lines: s.map(l => l.replace('вибух', 'не застосовувалася')) }, true);
  ok('не застосовувалася: full text, section 1', !!ns && ns.kind === 'full' && ns.target === 8106 && ns.body.length === s.length);
  status(res.join('   '));
};

render();

// PWA: service workers need https or localhost, so skip registration for file://.
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').catch(() => { /* app still works online */ });
}
</script></body></html>
